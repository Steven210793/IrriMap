<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>IrriMap</title>
<meta name="apple-mobile-web-app-title" content="IrriMap">
<meta name="application-name" content="IrriMap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%231d6b45%22/%3E%3Cpath%20d%3D%22M256%20446c-9%200-136-132-136-236a136%20136%200%200%201%20272%200c0%20104-127%20236-136%20236Z%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22190%22%20y%3D%22252%22%20width%3D%2230%22%20height%3D%2246%22%20rx%3D%226%22%20fill%3D%22%231d6b45%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22292%22%20width%3D%2254%22%20height%3D%2216%22%20rx%3D%225%22%20fill%3D%22%231d6b45%22/%3E%3Cpath%20d%3D%22M205%20248C220%20170%20300%20150%20336%20232%22%20fill%3D%22none%22%20stroke%3D%22%231f9bd7%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%221%2030%22/%3E%3Cpath%20d%3D%22M205%20248C215%20190%20262%20168%20300%20196%22%20fill%3D%22none%22%20stroke%3D%22%231f9bd7%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6b45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f2f5f1; --surface:#ffffff; --surface2:#e8eee7; --ink:#15211a; --ink2:#566559; --line:#d3ddd4;
  --accent:#1d6b45; --accent-ink:#ffffff; --accent-soft:#dcebe1; --alert:#d92d27; --scrim:rgba(12,20,15,.45);
  --shadow:0 10px 30px rgba(20,40,28,.18);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#17211b; --surface2:#1f2b24; --ink:#e4ede6; --ink2:#9aab9f; --line:#2c3a31;
    --accent:#4cbf86; --accent-ink:#0b1510; --accent-soft:#1f3a2b; --alert:#ff5a4f; --scrim:rgba(0,0,0,.6);
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#17211b; --surface2:#1f2b24; --ink:#e4ede6; --ink2:#9aab9f; --line:#2c3a31;
  --accent:#4cbf86; --accent-ink:#0b1510; --accent-soft:#1f3a2b; --alert:#ff5a4f; --scrim:rgba(0,0,0,.6);
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Leaflet essentials (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer,.leaflet-zoom-box{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;background:#fbfcfa;outline:0}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform;transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-control-container{display:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#v-map{overflow:hidden}
#map{position:absolute;inset:0}

/* map chrome */
.mapbar{position:absolute;z-index:500;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px 8px;box-shadow:var(--shadow)}
.brand .logo{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.02em;line-height:1.05}
.brand span{font-size:12px;color:var(--ink2)}
.mapbtns{pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.mbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;line-height:1}
.mbtn svg{width:20px;height:20px}
.hint{position:absolute;z-index:500;left:16px;right:16px;bottom:14px;margin:0 auto;max-width:340px;text-align:center;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.3;padding:8px 12px;border-radius:14px;pointer-events:none;opacity:.9;transition:opacity .4s}

/* tab bar */
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--ink2);font-family:var(--f-head);font-weight:600;font-size:10.5px;letter-spacing:.02em;text-transform:uppercase}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* list screens */
.screen{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.shead{display:flex;align-items:center;gap:10px;min-height:44px}
.shead h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance}
.shead .sub{font-size:13px;color:var(--ink2)}
.back{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.back svg{width:20px;height:20px}
.course{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 16px}
.course b{display:block;font-family:var(--f-head);font-size:24px;font-weight:700;line-height:1}
.course span{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.course .n{font-family:var(--f-code);font-size:13px;color:var(--ink2);text-align:right;flex:none}
.holes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.hole{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:78px}
.hole b{font-family:var(--f-head);font-size:30px;font-weight:700;line-height:1}
.hole.wide b{font-size:22px;padding-top:6px}
.hole span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:8px;right:8px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--alert);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.group{display:flex;flex-direction:column;gap:0}
.group h2{margin:6px 0 6px;font-family:var(--f-head);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stickyh{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:8px 0 6px;margin:4px 0 0}
.rows{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .code{font-family:var(--f-code);font-weight:600;font-size:16px;min-width:58px}
.row .meta{flex:1;min-width:0;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .obs{width:10px;height:10px;border-radius:50%;background:var(--alert);flex:none}
.row .chev{color:var(--ink2);flex:none}
.empty{color:var(--ink2);font-size:14px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:1000;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:88%;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 10px}
.shtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.shtop h3{margin:0;font-family:var(--f-code);font-size:26px;font-weight:600;line-height:1.1;word-break:break-word}
.shtop p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.shtop .x{margin-left:auto;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--f-head);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ctl{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px}
select.ctl{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea.ctl{min-height:84px;resize:vertical;line-height:1.4}
.inl{display:flex;gap:8px}
.inl .ctl{flex:1;min-width:0}
.save{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 16px;min-height:48px}
.obsline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.obsline i{width:10px;height:10px;border-radius:50%;background:var(--alert);display:inline-block}
.ghost{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ghost svg{width:18px;height:18px}

/* confirmation bubble */
.confirm{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:24px 16px;background:var(--scrim)}
.bubble{width:100%;max-width:360px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 16px 14px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}.sheet,.scrim{transition:none}}
.bubble h4{margin:0 0 10px;font-family:var(--f-head);font-size:22px;font-weight:700}
.chg{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.chg div{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:15px}
.chg small{display:block;font-family:var(--f-head);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.chg s{color:var(--ink2)}
.chg em{font-style:normal;font-weight:600}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bbtns button{min-height:48px;border-radius:12px;font-weight:600}
.bbtns .no{border:1px solid var(--line);background:none}
.bbtns .yes{border:0;background:var(--accent);color:var(--accent-ink)}
#map{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.search{position:fixed;inset:0;z-index:1050;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
.sbar{display:flex;gap:8px;align-items:center}
.sbar .ctl{flex:1;min-width:0;font-family:var(--f-code);font-size:18px;text-transform:uppercase}
.sres{flex:1;overflow-y:auto;margin-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sres .rows{margin-bottom:12px}
.hist{display:flex;flex-direction:column;gap:8px}
.he{background:var(--surface2);border-radius:12px;padding:9px 10px 10px 12px;border-left:4px solid var(--alert)}
.he.fix{border-left-color:var(--accent)}
.hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hd b{color:var(--ink);font-weight:600}
.hd .tag{font-family:var(--f-head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--accent)}
.hdel{margin-left:auto;width:36px;height:36px;border:0;background:none;color:var(--ink2);font-size:22px;line-height:1;border-radius:8px}
.he p{margin:4px 0 0;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--line);border:0;padding:0;display:block}
.pend{position:relative}
.pend .rm{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--bg);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.photo-btn{cursor:pointer;flex:none;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:600}
.photo-btn svg{width:20px;height:20px}
.field label.photo-btn{font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.save:disabled{opacity:.45}
.fixbtn{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.viewer{position:fixed;inset:0;z-index:1150;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.dragchip{position:absolute;z-index:500;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow);pointer-events:none}
.simbar{position:absolute;z-index:500;left:12px;right:12px;bottom:12px;margin:0 auto;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid #ff8a00;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.simbar div{flex:1;min-width:0;font-size:14px;line-height:1.3}
.simbar b{display:block;font-family:var(--f-head);font-size:16px;letter-spacing:.02em}
.simbar button{flex:none;min-height:44px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:600;padding:0 12px}
.sect{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.4}
.sect p{margin:0}
.warn{color:var(--alert);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-family:var(--f-code);font-size:14px;font-weight:600;min-height:36px}
.chip small{font-family:var(--f-body);font-weight:500;color:var(--ink2);margin-left:4px}
.simbtn{width:100%;min-height:48px;border-radius:12px;border:2px solid #ff8a00;background:none;font-weight:600;color:var(--ink)}
.simbtn.on{background:#ff8a00;color:#1b1206}
.toast{position:fixed;z-index:1200;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap}
.mbtn#zgeo.on{background:#1f9bd7;color:#fff}
</style>
</head>
<body>


<div id="app">
  <main>
    <section class="view" id="v-map">
      <div id="map"></div>
      <div class="mapbar">
        <div class="brand"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#1d6b45"/><path d="M256 446c-9 0-136-132-136-236a136 136 0 0 1 272 0c0 104-127 236-136 236Z" fill="#fff"/><rect x="190" y="252" width="30" height="46" rx="6" fill="#1d6b45"/><rect x="178" y="292" width="54" height="16" rx="5" fill="#1d6b45"/><path d="M205 248C220 170 300 150 336 232" fill="none" stroke="#1f9bd7" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 30"/><path d="M205 248C215 190 262 168 300 196" fill="none" stroke="#1f9bd7" stroke-width="16" stroke-linecap="round"/></svg><div><b>IrriMap</b><span id="stat">Golf de Bussy</span></div></div>
        <div class="mapbtns">
          <button class="mbtn" id="zsearch" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
          <button class="mbtn" id="zin" aria-label="Zoomer">+</button>
          <button class="mbtn" id="zout" aria-label="Dézoomer">−</button>
          <button class="mbtn" id="zfit" aria-label="Voir tout le plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="mbtn" id="zgeo" aria-label="Ma position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        </div>
      </div>
      <div class="hint" id="hint">Zoome pour voir les numéros · touche un arroseur ou une vanne · appui long pour le déplacer</div>
      <div class="dragchip" id="dragchip" hidden>Glisse puis relâche</div>
      <div class="simbar" id="simbar" hidden><div id="simtxt"></div><button id="simreset">Tout rouvrir</button></div>
    </section>
    <section class="view" id="v-holes" hidden></section>
    <section class="view" id="v-list" hidden></section>
    <section class="view" id="v-vannes" hidden></section>
    <section class="view" id="v-clapets" hidden></section>
    <section class="view" id="v-profil" hidden></section>
  </main>
  <nav class="tabs" role="tablist">

let simClosed=[]; try{ simClosed=[...new Set(JSON.parse(localStorage.getItem("irrimap-sim")||"[]").map(id=>(DATA.vmerge||{})[id]||id))].filter(id=>byId["v:"+id]); }catch(e){}
let simCut=new Set();
function recomputeSim(){ simCut=new Set(cutBy(new Set(simClosed.map(id=>keyOfValve[id]).filter(k=>k!==undefined)),new Set(simClosed)).map(s=>s.id));
  try{ localStorage.setItem("irrimap-sim",JSON.stringify(simClosed)); }catch(e){}
  updSimBar(); if(typeof redraw==="function") redraw(); }
function updSimBar(){ const bar=document.getElementById("simbar"); if(!bar) return;
  if(!simClosed.length){ bar.hidden=true; return; }
  document.getElementById("simtxt").innerHTML=`<b>Simulation</b>${simClosed.length} vanne${simClosed.length>1?"s":""} fermée${simClosed.length>1?"s":""} · ${simCut.size} arroseur${simCut.size>1?"s":""} coupé${simCut.size>1?"s":""}`;
  bar.hidden=false; const h=document.getElementById("hint"); if(h) h.hidden=true; }
function toggleSim(v){ const i=simClosed.indexOf(v.id); if(i>=0) simClosed.splice(i,1); else simClosed.push(v.id); recomputeSim(); }
function nameList(l,max){ const n=l.map(s=>get(s,"name")); return n.length>max ? n.slice(0,max).join(", ")+` … (+${n.length-max})` : n.join(", "); }

/* ---------- map ---------- */
const W=DATA.W,H=DATA.H;
const LL=(x,y)=>L.latLng(-y,x);
const bounds=L.latLngBounds([[-H,0],[0,W]]);
let selected=null;

/* ---------- geolocation calibration (plan px <-> GPS) ---------- */
// fit from green-center reference points; lat=A0*x+A1*y+A2, lon=B0*x+B1*y+B2
const GEO_A=[4.93616168e-09,-3.95941674e-06,4.88522968e+01];
const GEO_B=[5.92235616e-06,-1.64669469e-07,2.70452825e+00];
function pxToLL(x,y){ return [GEO_A[0]*x+GEO_A[1]*y+GEO_A[2], GEO_B[0]*x+GEO_B[1]*y+GEO_B[2]]; }
// invert the 2x2 linear part [A0 A1; B0 B1] to go GPS -> px
const _gdet=GEO_A[0]*GEO_B[1]-GEO_A[1]*GEO_B[0];
function llToPx(lat,lon){ const dl=lat-GEO_A[2], dg=lon-GEO_B[2];
  const x=( GEO_B[1]*dl - GEO_A[1]*dg)/_gdet, y=(-GEO_B[0]*dl + GEO_A[0]*dg)/_gdet; return [x,y]; }
let geoActive=false, geoWatchId=null, userPx=null, userAccPx=0, geoFirstFix=true;
function geoStop(){ geoActive=false; if(geoWatchId!==null) navigator.geolocation.clearWatch(geoWatchId); geoWatchId=null; userPx=null;
  document.getElementById("zgeo").classList.remove("on"); redraw(); }
function geoStart(){
  if(!navigator.geolocation){ toast("Géolocalisation non disponible"); return; }
  geoActive=true; geoFirstFix=true; document.getElementById("zgeo").classList.add("on");
  geoWatchId=navigator.geolocation.watchPosition(pos=>{
    const[x,y]=llToPx(pos.coords.latitude,pos.coords.longitude);
    userPx={x,y}; userAccPx=(pos.coords.accuracy||15)*sc_m2px();
    if(geoFirstFix){ geoFirstFix=false; map.flyTo(LL(x,y),Math.max(map.getZoom(),1),{duration:.6}); }
    redraw();
  }, err=>{ toast(err.code===1?"Autorise la localisation pour te situer":"Position indisponible"); geoStop(); },
  {enableHighAccuracy:true,maximumAge:4000,timeout:12000});
}
function geoCaptureFor(it){
  if(!navigator.geolocation){ toast("Géolocalisation non disponible"); return; }
  toast("Recherche du signal GPS…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const[x,y]=llToPx(pos.coords.latitude,pos.coords.longitude);
    const k=it.kind+":"+it.id; posOv[k]={x:Math.round(x*10)/10,y:Math.round(y*10)/10,capturedAt:new Date().toISOString()};
    persistPosOv();
    const m=markers[k]; if(m) m.setLatLng(LL(posOv[k].x,posOv[k].y));
    toast("Position mise à jour"); refreshAll();
  }, err=>{ toast(err.code===1?"Autorise la localisation pour capturer la position":"Position indisponible"); },
  {enableHighAccuracy:true,maximumAge:0,timeout:12000});
}
function sc_m2px(){ // meters -> plan px, using local scale near map center
  const c=map.getCenter(); const [x,y]=llToPx(c.lat,c.lng);
  const [la1,lo1]=pxToLL(x+50,y), dl=(la1-c.lat)*111320, dg=(lo1-c.lng)*111320*Math.cos(c.lat*Math.PI/180);
  const mPerPx=Math.hypot(dl,dg)/50; return mPerPx>0 ? 1/mPerPx : 0.5;
}

const LabelCanvas=L.Canvas.extend({
  _draw:function(){ L.Canvas.prototype._draw.call(this); drawOverlay(this._ctx); }
});
const renderer=new LabelCanvas({padding:0.6,tolerance:8});
const map=L.map("map",{crs:L.CRS.Simple,zoomSnap:0.25,zoomDelta:0.5,minZoom:-4.5,maxZoom:3,attributionControl:false,zoomControl:false,renderer,maxBounds:bounds.pad(0.25),maxBoundsViscosity:0.8,wheelPxPerZoomLevel:90,bounceAtZoomLimits:false});
L.tileLayer("tiles/{z}/{x}_{y}.webp",{tileSize:512,minNativeZoom:-2,maxNativeZoom:1,minZoom:-4.5,maxZoom:3,bounds,noWrap:true,keepBuffer:3,updateWhenZooming:false}).addTo(map);
map.fitBounds(bounds,{padding:[6,6]});

function fitText(ctx,t,x,y,halo){ if(halo){ctx.strokeText(t,x,y);} ctx.fillText(t,x,y); }
function drawOverlay(ctx){
  const z=map.getZoom(), sc=Math.pow(2,z); // px per plan point
  const P=(x,y)=>map.latLngToLayerPoint(LL(x,y));
  ctx.save();
  ctx.lineJoin="round"; ctx.textBaseline="middle";
  // words (bassins, zones)
  let fs=Math.min(15*sc,30);
  if(fs>=7){ ctx.font=`500 ${fs}px Barlow, system-ui, sans-serif`; ctx.fillStyle="#6b7a70"; ctx.textAlign="left";
    DATA.words.forEach(w=>{const p=P(w.x,w.y-5); ctx.fillText(w.t,p.x,p.y);}); }
  // hole numbers
  fs=Math.max(10,Math.min(22*sc,64));
  ctx.font=`700 ${fs}px "Barlow Condensed", system-ui, sans-serif`; ctx.textAlign="center"; ctx.fillStyle="#c8102e";
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=Math.max(2,fs/7);
  DATA.holes.forEach(h=>{const p=P(h.x,h.y); if(sc<0.35){ctx.strokeText(h.n,p.x,p.y);} ctx.fillText(h.n,p.x,p.y);});
  // pipe diameters
  fs=Math.min(3.8*sc,15);
  if(fs>=7.5){
    ctx.font=`600 ${fs}px Barlow, system-ui, sans-serif`; ctx.fillStyle="#111"; ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.lineWidth=3; ctx.textAlign="center";
    DATA.pipes.forEach(pp=>{const p=P(pp.x,pp.y); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(pp.a*Math.PI/180); ctx.translate(0,-fs*0.75); fitText(ctx,pp.t,0,0,true); ctx.restore();});
  }
  // sprinkler names
  fs=Math.min(4.6*sc,16);
  if(fs>=7){
    ctx.font=`600 ${fs}px "IBM Plex Mono", ui-monospace, monospace`; ctx.fillStyle="#000"; ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.lineWidth=3; ctx.textAlign="left";
    const off=Math.max(5,3*sc);
    SPR.forEach(s=>{const q=posOf(s),p=P(q.x,q.y); const dy = s.cat==="E" ? fs*0.85 : -fs*0.55; fitText(ctx,get(s,"name"),p.x+off,p.y+dy,true);});
  }
  // valve names (close zoom only)
  fs=Math.min(3.6*sc,13);
  if(fs>=9){
    ctx.font=`italic 500 ${fs}px Barlow, system-ui, sans-serif`; ctx.fillStyle="#3c4640"; ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.lineWidth=3; ctx.textAlign="left";
    const off=Math.max(6,4*sc);
    VAL.forEach(v=>{const q=posOf(v),p=P(q.x,q.y); fitText(ctx,get(v,"name"),p.x+off,p.y+fs*0.8,true);});
  }
  // red dots for observations
  const r=Math.max(3.5,Math.min(2.3*sc,7)), d=Math.max(3,1.8*sc);
  ctx.fillStyle="#e3261f"; ctx.strokeStyle="#fff"; ctx.lineWidth=1.6;
  ALL.forEach(it=>{ if(!hasObs(it)) return; const q=posOf(it),p=P(q.x,q.y); ctx.beginPath(); ctx.arc(p.x+d,p.y-d,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  // leak ("fuite") warning triangles
  if(leaks.length){
    const tr=Math.max(9,Math.min(6*sc,20));
    leaks.forEach(lk=>{ const p=P(lk.x,lk.y);
      ctx.save(); ctx.translate(p.x,p.y);
      ctx.beginPath(); ctx.moveTo(0,-tr); ctx.lineTo(tr*0.87,tr*0.6); ctx.lineTo(-tr*0.87,tr*0.6); ctx.closePath();
      ctx.fillStyle="#ffcc00"; ctx.fill(); ctx.lineWidth=Math.max(1.5,tr*0.12); ctx.strokeStyle="#1b1206"; ctx.stroke();
      ctx.fillStyle="#1b1206"; ctx.font=`700 ${Math.round(tr*0.95)}px "Barlow Condensed", system-ui, sans-serif`; ctx.textAlign="center"; ctx.fillText("!",0,tr*0.32);
      ctx.restore(); }); }
  // selection ring
  if(simClosed.length){
    const rr=Math.max(7,Math.min(3.6*sc,14));
    ctx.lineWidth=3; ctx.strokeStyle="#ff8a00"; ctx.fillStyle="rgba(255,138,0,.28)";
    SPR.forEach(s=>{ if(!simCut.has(s.id)) return; const q=posOf(s),p=P(q.x,q.y); ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
    const vr=Math.max(8,Math.min(4*sc,15));
    simClosed.forEach(id=>{ const v=byId["v:"+id]; const q=posOf(v),p=P(q.x,q.y);
      ctx.fillStyle="#d92d27"; ctx.beginPath(); ctx.arc(p.x,p.y,vr,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2.5; const k=vr*0.45; ctx.beginPath(); ctx.moveTo(p.x-k,p.y-k); ctx.lineTo(p.x+k,p.y+k); ctx.moveTo(p.x+k,p.y-k); ctx.lineTo(p.x-k,p.y+k); ctx.stroke(); });
  }
  if(drag){ const q=posOf(drag.it),p=P(q.x,q.y);
    ctx.strokeStyle="rgba(29,107,69,.9)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(p.x-26,p.y); ctx.lineTo(p.x+26,p.y); ctx.moveTo(p.x,p.y-26); ctx.lineTo(p.x,p.y+26); ctx.stroke();
    ctx.fillStyle="rgba(29,107,69,.25)"; ctx.beginPath(); ctx.arc(p.x,p.y,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#1d6b45"; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); }
  if(selected){ const q=posOf(selected),p=P(q.x,q.y); const rr=Math.max(11,5*sc);
    ctx.lineWidth=3; ctx.strokeStyle="#1d6b45"; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1.5; ctx.strokeStyle="#fff"; ctx.beginPath(); ctx.arc(p.x,p.y,rr+2.5,0,Math.PI*2); ctx.stroke(); }
  if(geoActive&&userPx){ const p=P(userPx.x,userPx.y), ar=Math.max(6,userAccPx*sc);
    if(ar>10){ ctx.fillStyle="rgba(31,155,215,.16)"; ctx.beginPath(); ctx.arc(p.x,p.y,ar,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle="#1f9bd7"; ctx.strokeStyle="#fff"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function redraw(){ renderer._redrawBounds=null; if(renderer._ctx) renderer._redraw(); }

// invisible hit targets (valves first so sprinklers sit on top)
const markers={};
let suppressClick=false;
[...VAL,...SPR].forEach(it=>{
  const p0=basePos(it);
  markers[it.kind+":"+it.id]=L.circleMarker(LL(p0.x,p0.y),{radius:10,stroke:false,fill:true,fillOpacity:0,renderer})
   .on("click",e=>{ L.DomEvent.stop(e); if(suppressClick) return; openSheet(it); }).addTo(map);
});
// leak marker hit-targets (tap to remove) — full version only
const leakMarkers={};
function syncLeakMarkers(){
  Object.keys(leakMarkers).forEach(id=>{ if(!leaks.find(l=>l.id===id)){ map.removeLayer(leakMarkers[id]); delete leakMarkers[id]; } });
  if(IS_TEAM_VERSION) return;
  leaks.forEach(lk=>{ if(leakMarkers[lk.id]) return;
    const m=L.circleMarker(LL(lk.x,lk.y),{radius:12,stroke:false,fill:true,fillOpacity:0,renderer})
      .on("click",e=>{ L.DomEvent.stop(e); if(suppressClick) return;
        ask([["Fuite",null,fmtD(lk.ts)+(lk.note?" · "+lk.note:"")]],()=>{ leaks=leaks.filter(x=>x.id!==lk.id); persistLeaks(); syncLeakMarkers(); redraw(); },null,"Marquer cette fuite comme réparée ?","Fuite retirée");
      }).addTo(map);
    leakMarkers[lk.id]=m; });
}
syncLeakMarkers();

// ---- click on a pipe -> nearest valve(s) that isolate it, + leak reporting ----
let pipeCtx=null;
function tryPipeClick(ll){
  if(!NET.pp || !NET.pp.length) return false;
  const plan_x=ll.lng, plan_y=-ll.lat;
  const sc=Math.pow(2,map.getZoom());
  const tolPlan=16/sc;
  let best=null,bd=tolPlan*tolPlan;
  for(const p of NET.pp){ const dx=p[0]-plan_x, dy=p[1]-plan_y, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=p;} }
  if(!best) return false;
  openPipeSheet(best[2],plan_x,plan_y);
  return true;
}
function openPipeSheet(node,cx,cy){
  open=null; selected=null; pipeCtx={node,cx,cy}; redraw();
  renderPipeSheet();
  scrim.hidden=false; sheet.hidden=false;
  requestAnimationFrame(()=>{scrim.classList.add("on");sheet.classList.add("on");});
}
function renderPipeSheet(){
  const {node,cx,cy}=pipeCtx;
  let cands=(nodeIsolators[node]||[]).slice(0,6), approx=false;
  let body;
  if(cands.length){
    body=`<p>${cands.length>1?"Vannes":"Vanne"} à fermer pour couper l’eau ici :</p><div class="chips">${cands.map(v=>`<button class="chip" data-open="v:${esc(v.id)}">${esc(get(v,"name"))}</button>`).join("")}</div>`;
  } else {
    // fallback: this stretch of pipe isn't cleanly isolated by the graph (it's covered by an
    // override sector instead) — show the nearest real vannes on the plan as a best guess
    approx=true;
    cands=VAL.filter(v=>!isClapet(v)).map(v=>{const q=posOf(v); return [Math.hypot(q.x-cx,q.y-cy),v];}).sort((a,b)=>a[0]-b[0]).slice(0,3).map(x=>x[1]);
    body = cands.length
      ? `<p>Pas de vanne isolant précisément ce tronçon dans le plan reconstruit. ${cands.length>1?"Vannes les plus proches":"Vanne la plus proche"} :</p><div class="chips">${cands.map(v=>`<button class="chip" data-open="v:${esc(v.id)}">${esc(get(v,"name"))}</button>`).join("")}</div><p class="warn">À vérifier sur le terrain.</p>`
      : `<p>Aucune vanne trouvée près de ce point.</p>`;
  }
  const near=leaks.filter(l=>Math.hypot(l.x-cx,l.y-cy)<25);
  sheet.innerHTML=`<div class="grab"></div>
  <div class="shtop"><div><h3 id="sh-title">Canalisation</h3><p>Point sur le réseau de tuyaux</p></div>
    <button class="x" id="sh-x" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="field"><label>Secteur</label><div class="sect">${body}</div></div>
  ${!IS_TEAM_VERSION?`<button class="ghost" id="b-leak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>${near.length?"Retirer la fuite signalée ici":"Signaler une fuite ici"}</button>`:""}`;
  document.getElementById("sh-x").onclick=closeSheet;
  sheet.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.open]));
  const bl=document.getElementById("b-leak");
  if(bl) bl.onclick=()=>{
    if(near.length){ leaks=leaks.filter(l=>!near.includes(l)); toast("Fuite retirée"); }
    else { leaks.push({id:uid(),x:cx,y:cy,ts:new Date().toISOString()}); toast("Fuite signalée sur la carte"); }
    persistLeaks(); syncLeakMarkers(); closeSheet(); redraw();
  };
}

map.on("zoomend",redraw);
map.on("click",e=>{

/* long press -> drag -> release -> validation */
const mc=map.getContainer(), dragchip=document.getElementById("dragchip");
let lp=null;
const LIFT=46; // item floats above the finger so it stays visible
function cpOf(e){ const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e); const r=mc.getBoundingClientRect(); return L.point(t.clientX-r.left,t.clientY-r.top); }
function hitAt(cp){ let best=null,bd=24*24; ALL.forEach(it=>{ const q=basePos(it); const p=map.latLngToContainerPoint(LL(q.x,q.y)); const d=(p.x-cp.x)**2+(p.y-cp.y)**2; if(d<bd){bd=d;best=it;} }); return best; }
function startLP(cp){ if(IS_TEAM_VERSION) return; cancelLP(); if(drag) return; const it=hitAt(cp); if(!it) return; lp={p0:cp,it,timer:setTimeout(()=>beginDrag(it,cp),550)}; }
function cancelLP(){ if(lp){ clearTimeout(lp.timer); lp=null; } }
function beginDrag(it,cp){
  lp=null; const p0b=basePos(it), x0=p0b.x, y0=p0b.y;
  drag={it,x0,y0,x:x0,y:y0};
  map.dragging.disable(); map.touchZoom.disable(); if(map.tap) map.tap.disable();
  try{ navigator.vibrate&&navigator.vibrate(35); }catch(e){}
  selected=it; dragchip.textContent="Déplacer "+get(it,"name")+" : glisse puis relâche"; dragchip.hidden=false;
  moveDrag(cp);
}
function moveDrag(cp){ const ll=map.containerPointToLatLng(L.point(cp.x,cp.y-LIFT)); drag.x=Math.round(ll.lng*10)/10; drag.y=Math.round(-ll.lat*10)/10; redraw(); }
function endDrag(){
  const d=drag; dragchip.hidden=true;
  map.dragging.enable(); map.touchZoom.enable(); if(map.tap) map.tap.enable();
  suppressClick=true; setTimeout(()=>suppressClick=false,450);
  const moved=Math.hypot(d.x-d.x0,d.y-d.y0)>0.4;
  if(!moved){ drag=null; redraw(); return; }
  ask([["Position",null,"Nouvel emplacement sur la carte"]],()=>{ drag=null; delete posOv[d.it.kind+":"+d.it.id]; persistPosOv(); markers[d.it.kind+":"+d.it.id].setLatLng(LL(d.x,d.y)); setFields(d.it,{x:d.x,y:d.y}); },
      ()=>{ drag=null; redraw(); }, "Déplacer "+get(d.it,"name")+" ici ?", "Arroseur déplacé");
}
mc.addEventListener("touchstart",e=>{ if(e.touches.length!==1){ cancelLP(); return; } startLP(cpOf(e)); },{passive:true});
mc.addEventListener("touchmove",e=>{ if(drag&&cf.hidden){ e.preventDefault(); e.stopPropagation(); moveDrag(cpOf(e)); return; } if(lp&&cpOf(e).distanceTo(lp.p0)>9) cancelLP(); },{passive:false,capture:true});
mc.addEventListener("touchend",e=>{ if(drag&&cf.hidden){ e.preventDefault(); endDrag(); } cancelLP(); },{passive:false,capture:true});
mc.addEventListener("touchcancel",()=>{ cancelLP(); if(drag&&cf.hidden) endDrag(); });
mc.addEventListener("mousedown",e=>{ if(e.button===0) startLP(cpOf(e)); });
window.addEventListener("mousemove",e=>{ if(drag&&cf.hidden){ moveDrag(cpOf(e)); return; } if(lp&&cpOf(e).distanceTo(lp.p0)>6) cancelLP(); });
window.addEventListener("mouseup",()=>{ if(drag&&cf.hidden) endDrag(); cancelLP(); });
mc.addEventListener("contextmenu",e=>e.preventDefault());
document.getElementById("zin").onclick=()=>map.zoomIn(0.75);
document.getElementById("zout").onclick=()=>map.zoomOut(0.75);

setTimeout(()=>{hint.style.opacity=0;setTimeout(()=>hint.hidden=true,500);},7000);

function fitItems(items){ const pts=items.map(it=>{const q=posOf(it); return LL(q.x,q.y);}); if(!pts.length) return;
  if(pts.length===1) map.flyTo(pts[0],Math.max(map.getZoom(),1.25),{duration:.6}); else map.flyToBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:1.5,duration:.6}); }

/* ---------- search ---------- */
const sBox=document.getElementById("search"), qIn=document.getElementById("q"), sRes=document.getElementById("sres");
const norm=t=>String(t).toUpperCase().replace(/[\s.\-_]/g,"");
function srow(it){ const sub = it.kind==="s" ? `${it.course} trous · ${holeLabel(it.hole)} · ${get(it,"type")}` : it.type;
  return `<button class="row" data-id="${it.kind}:${esc(it.id)}"><span class="code">${esc(get(it,"name"))}</span><span class="meta">${esc(sub)}</span>${hasObs(it)?'<span class="obs"></span>':""}${chev}</button>`; }
function doSearch(){
  const q=norm(qIn.value);
  if(!q){ sRes.innerHTML='<p class="empty">Tape un numéro d’arroseur (13G1, 9T2…) ou de vanne (V12).</p>'; return; }

  sRes.innerHTML = hits.length ? `<div class="rows">${hits.map(h=>srow(h[1])).join("")}</div>` : '<p class="empty">Aucun résultat.</p>';
}

function buildExportText(){
  const clean=t=>String(t).replace(/[|\r\n]/g,' ').trim();
  const lines=["IRRIMAP_EXPORT_V1"];
  ALL.forEach(it=>{ logOf(it).forEach(e=>{ if(!e.t||!String(e.t).trim()) return;
    lines.push(`#${it.kind}:${it.id}|${clean(get(it,"name"))}|${e.d}|${clean(e.t)}`); }); });
  return lines.join("\n");
}
async function doExport(){
  const txt=buildExportText();
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  location.href="sms:+33652224152?body="+encodeURIComponent(txt);
}
function doImport(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=0;
  lines.forEach(line=>{
    if(!line.startsWith("#")) return;
    const parts=line.slice(1).split("|");
    if(parts.length<4){ fail++; return; }
    const elId=parts[0], d=parts[2], txt=parts.slice(3).join("|");
    const it=byId[elId];
    if(!it){ fail++; return; }
    const dt=new Date(d), dISO=isNaN(+dt)?new Date().toISOString():dt.toISOString();
    const log=[...logOf(it),{id:uid(),d:dISO,t:txt,ph:[]}];
    edits[it.kind][it.id]=Object.assign(edits[it.kind][it.id]||{},{log});
    ok++;
  });
  persist(); refreshAll();
  return ok+" observation"+(ok>1?"s":"")+" importée"+(ok>1?"s":"")+(fail?`, ${fail} ligne${fail>1?"s":""} ignorée${fail>1?"s":""}`:"");
}

  <button class="ghost" id="sh-map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Voir sur la carte</button>
  ${!IS_TEAM_VERSION?`<button class="ghost" id="sh-geo" style="margin-top:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Géoloc${posOv[it.kind+":"+it.id]?" (position capturée)":""}</button>`:""}`;
  const $=id=>document.getElementById(id);
  $("sh-x").onclick=closeSheet;
  $("sh-map").onclick=()=>{ const x=open; closeSheet(); showOnMap(x); };
  const shg=$("sh-geo"); if(shg) shg.onclick=()=>geoCaptureFor(it);
  const nm=$("f-name"), sn=$("s-name");
  if(nm&&sn){
    nm.oninput=()=>{ sn.hidden = nm.value.trim()===get(it,"name") || !nm.value.trim(); };
    sn.onclick=()=>{ const v=nm.value.trim(); ask([["Nom",get(it,"name"),v]],()=>setFields(it,{name:v}),()=>{nm.value=get(it,"name");sn.hidden=true;}); };
    nm.onkeydown=e=>{ if(e.key==="Enter"&&!sn.hidden){e.preventDefault();sn.click();} };
  }
  const ob=$("f-obs"), so=$("s-obs");
  const upd=()=>{ so.disabled = !ob.value.trim() && !draftPh.length; };
  ob.oninput=()=>{ draftTxt=ob.value; upd(); };
  renderPending(); upd();
  const fi=document.getElementById("f-photo");
  if(!IS_TEAM_VERSION){
    fi.onchange=async()=>{ const f=fi.files&&fi.files[0]; if(!f) return;
        try{ const b=await shrink(f); draftPh.push({b,u:URL.createObjectURL(b)}); renderPending(); upd(); }catch(e){ toast("Photo illisible, réessaie"); } fi.value=""; };
    $("b-photo").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fi.click(); } };
  }
  so.onclick=()=>{ const v=ob.value.trim(), n=draftPh.length;
    ask([["Observation",null,(v||"(sans texte)")+(n?` · ${n} photo${n>1?"s":""}`:"")]],async()=>{
      const ids=[]; for(const p of draftPh){ const id=uid(); try{ await idb.put(id,p.b); urlCache[id]=p.u; ids.push(id); }catch(e){ toast("Photo non enregistrée (stockage plein ?)"); } }
      const log=[...logOf(it),{id:uid(),d:new Date().toISOString(),t:v,ph:ids}]; draftTxt=""; draftPh=[]; setFields(it,{log});
    },null,"Ajouter l’observation ?","Observation ajoutée"); };
  const bf=$("b-fix");
  if(bf) bf.onclick=()=>ask([["Arroseur",null,get(it,"name")+" fonctionne à nouveau"]],()=>{ setFields(it,{log:[...logOf(it),{id:uid(),d:new Date().toISOString(),t:"",ph:[],fix:true}]}); },null,"Marquer comme réparé ?","Point rouge retiré");
  sheet.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const e=logOf(it).find(x=>x.id===b.dataset.del); if(!e) return;
    ask([["Entrée du "+fmtD(e.d),null,e.fix?"Réparé":(e.t||"(photo)")]],()=>{ (e.ph||[]).forEach(id=>idb.del(id).catch(()=>{})); setFields(it,{log:logOf(it).filter(x=>x!==e)}); },null,"Supprimer cette entrée ?","Entrée supprimée"); });
  loadThumbs(sheet);
  const bs=$("b-sim"); if(bs) bs.onclick=()=>{ const v=open; toggleSim(v); const on=simClosed.includes(v.id); closeSheet(); switchTab("map");
    setTimeout(()=>{ map.invalidateSize(); fitItems(on?[v,...(single[v.id]||[])]:[v]); },30); toast(on?`${get(v,"name")} fermée (simulation)`:`${get(v,"name")} rouverte`); };
  sheet.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.open]));
  if(isS&&!IS_TEAM_VERSION){
    const ft=$("f-type"), fb=$("f-buse");
    ft.onchange=()=>{ const nt=ft.value, ot=get(it,"type"), ob2=get(it,"buse"); const nb=TYPES[nt].includes(ob2)?ob2:TYPES[nt][0];
      const ch=[["Type",ot,nt]]; if(nb!==ob2) ch.push(["Buse",ob2,nb]);
      ask(ch,()=>setFields(it,{type:nt,buse:nb}),()=>{ft.value=ot;}); };
    fb.onchange=()=>{ const nb=fb.value, ob2=get(it,"buse"); ask([["Buse",ob2,nb]],()=>setFields(it,{buse:nb}),()=>{fb.value=ob2;}); };
  }
}

/* ---------- validation bubble ---------- */
const cf=document.getElementById("confirm");
function ask(changes,onYes,onNo,title,done){
  cf.innerHTML=`<div class="bubble" role="alertdialog" aria-labelledby="cf-t"><h4 id="cf-t">${esc(title||"Valider la modification ?")}</h4>
  <div class="chg">${changes.map(([f,a,b])=>`<div><small>${esc(f)}</small>${a===null?"":`<s>${esc(a)}</s> → `}<em>${esc(b)}</em></div>`).join("")}</div>
  <div class="bbtns"><button class="no" id="cf-no">Annuler</button><button class="yes" id="cf-yes">Valider</button></div></div>`;
  cf.hidden=false;
  document.getElementById("cf-yes").focus();
  document.getElementById("cf-no").onclick=()=>{cf.hidden=true; onNo&&onNo();};
  document.getElementById("cf-yes").onclick=()=>{cf.hidden=true; onYes(); toast(done||"Modification enregistrée");};
}
let tt;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

function refreshAll(){ redraw(); updStat(); if(open) renderSheet(); if(current!=="map") render(current); }
updStat(); recomputeSim();
if(!IS_TEAM_VERSION && "serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}
document.fonts && document.fonts.ready.then(redraw);
</script>
